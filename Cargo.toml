[package]
name = "telescrap-sr"
version = "2.1.13"
edition = "2024"

[dependencies]
scanner = { path = "crates/scanner" }
parser = { path = "crates/parser" }
telegram-notifier = { path = "crates/telegram-notifier" }
admin-panel = { path = "crates/admin-panel" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dotenv = "0.15"
env_logger = "0.11"
chrono = "0.4"
chrono-tz = "0.10"

[workspace]
members = ["crates/*"]
resolver = "3"
